# =====================================================================
# Plan d'adressage du déploiement VirtualBox de l'équipe (SAÉ 3.02 - groupe A113)
# Lu par install.sh (rôles database / serveur SANS --db ni --serveur), par les scripts et par l'IHM.
# Sur des VM quelconques (réseau déjà configuré), ces adresses ne servent pas : voir le README.
# Pour changer une valeur SANS modifier ce fichier versionné :
#   - créer deploy/carrefour.local.conf (ignoré par Git) avec les lignes à remplacer, ou
#   - exporter une variable d'environnement CARREFOUR_<NOM> (ex. CARREFOUR_TOKEN).
# Aucun secret ici : le mot de passe de la base et le jeton sont GÉNÉRÉS par install.sh
# (pour imposer une valeur : DB_PASSWORD=... / TOKEN=... dans deploy/carrefour.local.conf).
# Format : NOM=valeur (une valeur par ligne, sans commentaire sur la même ligne)
# =====================================================================

# Réseau « clients » (host-only VirtualBox) : le PC et la VM Serveur
IP_SERVEUR_CLIENTS=192.168.56.101
RESEAU_CLIENTS=192.168.56.0/24

# Réseau « données » (réseau interne VirtualBox) : VM Serveur <-> VM Database
IP_SERVEUR_DONNEES=10.10.10.1
IP_DATABASE=10.10.10.2
MASQUE=24

# Base de données (le mot de passe et le jeton des postes IHM ne sont PAS versionnés)
DB_NAME=carrefour
DB_USER=carrefour

# Noms des interfaces réseau : laisser vide = détection automatique
# (1re carte = NAT ; puis, dans l'ordre des cartes VirtualBox : clients, puis données)
IFACE_CLIENTS=
IFACE_DONNEES=
